name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Override the calculated version, e.g. 1.0.0
        required: false

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          version: ${{ inputs.version }}
